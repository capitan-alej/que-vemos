name: Actualizar ¿Qué vemos?

on:
  schedule:
    # Todos los jueves a las 09:00 hora Argentina (12:00 UTC)
    - cron: "0 12 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Investigar y armar la semana
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/update-picks.js

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "que-vemos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualización semanal automática"
          git push
