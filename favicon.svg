<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#000000"/>
  <!-- film sprocket holes -->
  <g fill="#d9a441">
    <rect x="8" y="9" width="6" height="6" rx="1.5"/>
    <rect x="8" y="24.5" width="6" height="6" rx="1.5"/>
    <rect x="8" y="40" width="6" height="6" rx="1.5"/>
    <rect x="50" y="9" width="6" height="6" rx="1.5"/>
    <rect x="50" y="24.5" width="6" height="6" rx="1.5"/>
    <rect x="50" y="40" width="6" height="6" rx="1.5"/>
  </g>
  <!-- frame -->
